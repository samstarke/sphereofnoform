<?xml version="1.0" encoding="utf-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
<head>
   <meta http-equiv="content-type" content="text/html; charset=utf-8" />
   <meta http-equiv="content-language" content="en" />
   <meta name="description" content="Tentai Show :: SoNF" />
   <meta name="keywords" content="" />
   <meta name="revisit-after" content="7 days" />
   <title>Tentai Show :: SoNF</title>
   <link href="./tentai-show.css" rel="stylesheet" type="text/css" />
</head>
<body>
   <div id="controls">
       <!-- Preset square sizes -->
       <button type="button" data-width="5" data-height="5">5x5</button>
       <button type="button" data-width="7" data-height="7">7x7</button>
       <button type="button" data-width="9" data-height="9">9x9</button>
       <button type="button" data-width="11" data-height="11">11x11</button>

       <!-- Custom size controls -->
       <div id="custom-controls">
         <label for="width-input">Width:</label>
         <input type="number" id="width-input" min="1" value="7" />

         <label for="height-input">Height:</label>
         <input type="number" id="height-input" min="1" value="7" />

         <button id="apply-custom">Apply</button>
       </div>
   </div>

   <div id="game-container">
      <!-- The interactive grid container -->
      <div id="grid"></div>
   </div>

   <script src="./tentai-show.js" type="text/javascript"></script>
</body>
</html>
